[workspace]
resolver = "3"
members = ["crates/rtools"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ui
gpui-kit = { version = "0.9.1", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
tree-sitter-xml = "0.7"

# network
async-io = "2"
rig-reqwest = { version = "0.46", default-features = false, features = ["rustls"] }
url = "2"

# ai
rig-core = { version = "0.46", default-features = false }

# script
rquickjs = "0.14"

# data formats
form_urlencoded = "1.2"
image = { version = "0.25", default-features = false }
quick-xml = "0.42"
serde = "1.0"
serde-saphyr = "2.1"
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
similar = "3"
toml = "1"

# platform
dirs = "7"
evdev = "0.13"
interprocess = "2.4"
ksni = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
rdev = "0.5"
sys-locale = "0.3"
tray-icon = "0.26"

# infra
futures = "0.3"
rust-i18n = "4.2"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
