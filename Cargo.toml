[workspace]
resolver = "3"
members = ["crates/rtools"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ui
gpui-kit = { version = "0.9.1", features = ["tree-sitter"] }
tree-sitter-xml = "0.7"

# script
rquickjs = "0.14"

# data formats
form_urlencoded = "1.2"
image = { version = "0.25", default-features = false }
quick-xml = "0.42"
serde = "1.0"
serde-saphyr = "2.1"
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
toml = "1"

# platform
dirs = "7"
evdev = "0.13"
interprocess = "2.4"
ksni = { version = "0.3", default-features = false }
rdev = "0.5"
sys-locale = "0.3"
tray-icon = "0.26"

# infra
futures = "0.3"
rust-i18n = "4.2"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
