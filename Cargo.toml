[workspace]
resolver = "3"
members = ["crates/rtools"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ui
gpui-kit = { version = "0.9.1", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
tree-sitter-xml = "0.7"

# network
async-io = "2"
rig-reqwest = { version = "0.46", default-features = false, features = ["rustls"] }
url = "2"

# ai
rig-core = { version = "0.46", default-features = false }

# script
rquickjs = "0.14"

# data formats
form_urlencoded = "1.2"
image = { version = "0.25", default-features = false }
plist = "1.10"
quick-xml = "0.42"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = "1.0"
serde-saphyr = "2.1"
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
similar = "3"
toml = "1"

# platform
clipboard-win = { version = "5.4", features = ["monitor", "std"] }
dirs = "7"
evdev = "0.13"
interprocess = "2.4"
ksni = { version = "0.3", default-features = false }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-service-management = { version = "0.3.2", default-features = false }
rdev = "0.5"
rustix = "1"
sys-locale = "0.3"
tray-icon = "0.26"
windows-registry = "0.6.1"
windows-win = "3"
wl-clipboard-rs = "0.9.5"
x11rb = "0.13"

# infra
futures = "0.3"
rust-i18n = "4.2"
tempfile = "3"
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
