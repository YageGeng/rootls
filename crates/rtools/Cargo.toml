[package]
name = "rtools"
edition.workspace = true
version.workspace = true

[dependencies]
# ui
gpui-kit = { workspace = true }
tree-sitter-xml = { workspace = true }

# network
async-io = { workspace = true }
rig-reqwest = { workspace = true }
url = { workspace = true }

# ai
rig-core = { workspace = true }

# script
rquickjs = { workspace = true }

# data formats
form_urlencoded = { workspace = true }
image = { workspace = true, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
quick-xml = { workspace = true }
rusqlite = { workspace = true, features = ["hooks"] }
serde = { workspace = true, features = ["derive"] }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }
toml = { workspace = true }

# platform
dirs = { workspace = true }
interprocess = { workspace = true }
sys-locale = { workspace = true }

# infra
futures = { workspace = true }
rust-i18n = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
# platform
evdev = { workspace = true }
ksni = { workspace = true, features = ["async-io"] }
rustix = { workspace = true, features = ["event"] }
wl-clipboard-rs = { workspace = true }
x11rb = { workspace = true, features = ["xfixes"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# platform
tray-icon = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# data formats
plist = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# platform
libc = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-core-foundation = { workspace = true, features = ["CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { workspace = true, features = ["CGEvent", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }
objc2-service-management = { workspace = true, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
# platform
clipboard-win = { workspace = true }
rdev = { workspace = true }
windows-registry = { workspace = true }
windows-win = { workspace = true }
