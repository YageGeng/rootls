    zh-CN: "请求过于频繁，请稍后手动重试。"
  error_redirect:
    en: "The service redirected the request. Enter the final endpoint to keep your key protected."
    zh-CN: "服务返回了重定向。为保护 Key，请直接填写最终请求地址。"
  error_service:
    en: "The model service is unavailable. Try again later."
    zh-CN: "模型服务暂时不可用，请稍后重试。"
  error_network:
    en: "Connection failed. Check the network, certificate and endpoint."
    zh-CN: "连接失败，请检查网络、证书和请求地址。"
  error_timeout:
    en: "Response timed out. Received text has been kept."
    zh-CN: "等待响应超时，已保留收到的译文。"
  error_protocol:
    en: "The response format is incompatible; translation did not complete."
    zh-CN: "响应格式不兼容，未能完成翻译。"
  error_interrupted:
    en: "Connection interrupted; translation is incomplete."
    zh-CN: "连接中断，译文不完整。"
  error_empty_response:
    en: "The model returned no translation. Check model settings and retry."
    zh-CN: "模型没有返回译文，请检查模型设置后重试。"
  error_output_limit:
    en: "Response size limit reached; translation is incomplete."
    zh-CN: "响应超过安全大小限制，译文不完整。"
